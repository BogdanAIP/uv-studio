name: Stage 12 explicit legacy fixtures

on:
  push:
    branches:
      - stage-12/studio-v2-application-transactions

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-12/studio-v2-application-transactions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Make legacy test identities explicit
        run: python tools/stage12_explicit_legacy_identity_migration.py
      - name: Commit deterministic fixture migration
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- tests tests_api; then
            echo "No fixture migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests tests_api
          git commit -m "tests: make legacy project identity explicit"
          git push origin HEAD:stage-12/studio-v2-application-transactions
