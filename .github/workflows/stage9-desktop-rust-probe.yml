name: Stage 9 Rust Desktop Host Probe

on:
  pull_request:
    paths:
      - ".github/workflows/stage9-desktop-rust-probe.yml"
      - "desktop-host/**"
      - "packaging/windows/**"
      - "project-context/**"
      - "tools/stage_windows_release.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-rust-host:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install exact Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = (Get-Content 'desktop-host/rust-toolchain.toml' -Raw)
          if ($toolchain -notmatch 'channel\s*=\s*"([^"]+)"') {
            throw 'desktop Rust toolchain channel missing'
          }
          $version = $Matches[1]
          rustup toolchain install $version --profile minimal --target x86_64-pc-windows-msvc
          $actual = (rustup run $version rustc --version)
          if (-not $actual.StartsWith("rustc $version ")) {
            throw "unexpected rustc version: $actual"
          }

      - name: Verify committed dependency lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content 'desktop-host/Cargo.lock' -Raw
          if ($lock -notmatch 'name = "webview2-com"') {
            throw 'Cargo.lock does not contain webview2-com'
          }
          if ($lock -notmatch 'name = "windows"') {
            throw 'Cargo.lock does not contain windows crate'
          }

      - name: Test Rust desktop host from exact lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = Get-Content 'desktop-host/rust-toolchain.toml' -Raw
          $toolchain -match 'channel\s*=\s*"([^"]+)"' | Out-Null
          $version = $Matches[1]
          rustup run $version cargo test --locked --manifest-path desktop-host/Cargo.toml

      - name: Build Rust desktop host from exact lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = Get-Content 'desktop-host/rust-toolchain.toml' -Raw
          $toolchain -match 'channel\s*=\s*"([^"]+)"' | Out-Null
          $version = $Matches[1]
          rustup run $version cargo build --release --locked --manifest-path desktop-host/Cargo.toml
          $exe = 'desktop-host/target/release/uv-studio-desktop.exe'
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw 'Rust desktop host executable missing after release build'
          }

      - name: Provision and prove Microsoft Evergreen WebView2 Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'desktop-host/target/release/uv-studio-desktop.exe').Path

          function Invoke-WebView2RuntimeCheck {
            # uv-studio-desktop.exe uses the Windows GUI subsystem. PowerShell's
            # call operator does not reliably populate $LASTEXITCODE for GUI apps,
            # so wait on the process object and read its real process exit code.
            $probe = Start-Process -FilePath $exe -ArgumentList '--runtime-check' -Wait -PassThru
            return $probe.ExitCode
          }

          $runtimeExit = Invoke-WebView2RuntimeCheck
          $runtimePresent = $runtimeExit -eq 0
          Write-Host "Initial WebView2 runtime-check exit=$runtimeExit"
          if (-not $runtimePresent) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
            if (-not (Test-Path $bootstrapper -PathType Leaf)) {
              throw 'WebView2 Evergreen Bootstrapper download missing'
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
            if ($signature.Status -ne 'Valid') {
              throw "WebView2 bootstrapper Authenticode status is $($signature.Status)"
            }
            if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -notmatch '^CN=Microsoft Corporation(?:,|$)') {
              throw "unexpected WebView2 bootstrapper signer: $($signature.SignerCertificate.Subject)"
            }
            Write-Host "WebView2 bootstrapper signer: $($signature.SignerCertificate.Subject)"
            Write-Host "WebView2 bootstrapper sha256: $((Get-FileHash -Algorithm SHA256 -LiteralPath $bootstrapper).Hash.ToLowerInvariant())"
            $install = Start-Process -FilePath $bootstrapper -ArgumentList '/silent','/install' -Wait -PassThru
            if ($install.ExitCode -ne 0) {
              throw "WebView2 bootstrapper failed with exit $($install.ExitCode)"
            }
          }

          $runtimeReady = $false
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            $runtimeExit = Invoke-WebView2RuntimeCheck
            Write-Host "WebView2 runtime-check attempt $attempt/12 exit=$runtimeExit"
            if ($runtimeExit -eq 0) {
              $runtimeReady = $true
              break
            }
            if ($attempt -lt 12) {
              Start-Sleep -Seconds 5
            }
          }

          if (-not $runtimeReady) {
            Write-Host 'WebView2/EdgeUpdate client registrations after failed readiness proof:'
            $registryRoots = @(
              'HKCU:\Software\Microsoft\EdgeUpdate\Clients',
              'HKLM:\Software\Microsoft\EdgeUpdate\Clients',
              'HKLM:\Software\WOW6432Node\Microsoft\EdgeUpdate\Clients'
            )
            foreach ($root in $registryRoots) {
              if (Test-Path $root) {
                Write-Host "REGISTRY_ROOT=$root"
                Get-ChildItem $root -ErrorAction SilentlyContinue | ForEach-Object {
                  $item = Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue
                  Write-Host "  key=$($_.PSChildName) name=$($item.name) pv=$($item.pv)"
                }
              }
            }
            throw 'Microsoft Evergreen WebView2 Runtime is still unavailable after bounded post-install polling'
          }

      - name: Upload Rust desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: stage9-rust-desktop-host
          path: desktop-host/target/release/uv-studio-desktop.exe
          if-no-files-found: error
          retention-days: 14
