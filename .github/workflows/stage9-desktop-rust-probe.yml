name: Stage 9 Rust Desktop Host Probe

on:
  push:
    branches: ["stage-9/**"]
    paths:
      - ".github/workflows/stage9-desktop-rust-probe.yml"
      - "desktop-host/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stage9-desktop-rust-probe.yml"
      - "desktop-host/**"

jobs:
  windows-rust-host:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install exact Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.97.1 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust 1.97.1 installation failed' }
          $actual = (& rustup run 1.97.1 rustc --version).Trim()
          if ($actual -notmatch '^rustc 1\.97\.1 ') { throw "unexpected Rust compiler: $actual" }

      - name: Verify committed dependency lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath desktop-host/Cargo.lock -PathType Leaf)) {
            throw 'committed desktop-host/Cargo.lock is missing'
          }
          git diff --exit-code -- desktop-host/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Cargo.lock was dirty before the Rust probe' }

      - name: Test Rust desktop host from exact lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & rustup run 1.97.1 cargo test --locked --manifest-path desktop-host/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust desktop host tests failed' }
          git diff --exit-code -- desktop-host/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Cargo test mutated the committed lock' }

      - name: Build Rust desktop host from exact lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & rustup run 1.97.1 cargo build --release --locked --manifest-path desktop-host/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust desktop host build failed' }
          $exe = 'desktop-host/target/release/uv-studio-desktop.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'desktop host executable is missing' }
          git diff --exit-code -- desktop-host/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Cargo build mutated the committed lock' }

      - name: Probe WebView2 runtime presence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'desktop-host/target/release/uv-studio-desktop.exe'
          & $exe --runtime-check
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 Runtime is unavailable on the Windows product runner' }

      - name: Upload Rust desktop executable
        uses: actions/upload-artifact@v6
        with:
          name: stage9-rust-desktop-host-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: desktop-host/target/release/uv-studio-desktop.exe
