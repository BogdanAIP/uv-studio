name: CI

on:
  push:
    branches: [main, "stage-*/**", "fix/**", "chore/**", "research/**"]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]

jobs:
  development-context:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate development context
        run: python tools/validate_development_context.py

  frontend-lint-remediation-preview:
    if: github.event_name == 'push' && github.ref_name == 'fix/dependency-ownership'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply narrow lint remediation candidate
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected remediation source not found in {path}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          settings = "frontend/app/settings/page.tsx"
          replace(settings, "type ConfigTree = Record<string, any>;", "type ConfigTree = Record<string, unknown>;")
          replace(
              settings,
              """function getValue(config: ConfigTree, path: string) {\n  return path.split('.').reduce((current, key) => current?.[key], config);\n}\n\nfunction setValue(config: ConfigTree, path: string, value: any): ConfigTree {\n  const next = structuredClone(config || {});\n  const parts = path.split('.');\n  let current = next;\n  for (const part of parts.slice(0, -1)) {\n    current[part] = current[part] || {};\n    current = current[part];\n  }\n  current[parts[parts.length - 1]] = value;\n  return next;\n}\n""",
              """function isConfigTree(value: unknown): value is ConfigTree {\n  return typeof value === 'object' && value !== null && !Array.isArray(value);\n}\n\nfunction getValue(config: ConfigTree, path: string): unknown {\n  let current: unknown = config;\n  for (const key of path.split('.')) {\n    if (!isConfigTree(current)) return undefined;\n    current = current[key];\n  }\n  return current;\n}\n\nfunction setValue(config: ConfigTree, path: string, value: unknown): ConfigTree {\n  const next = structuredClone(config || {});\n  const parts = path.split('.');\n  let current: ConfigTree = next;\n  for (const part of parts.slice(0, -1)) {\n    const child = current[part];\n    if (!isConfigTree(child)) current[part] = {};\n    current = current[part] as ConfigTree;\n  }\n  current[parts[parts.length - 1]] = value;\n  return next;\n}\n\nfunction errorMessage(error: unknown, fallback: string) {\n  return error instanceof Error && error.message ? error.message : fallback;\n}\n""",
          )
          replace(
              settings,
              """      } catch (e: any) {\n        setError(e.message || '读取配置失败');\n""",
              """      } catch (error: unknown) {\n        setError(errorMessage(error, '读取配置失败'));\n""",
          )
          replace(
              settings,
              """    } catch (e: any) {\n      setError(e.message || '保存配置失败');\n""",
              """    } catch (error: unknown) {\n      setError(errorMessage(error, '保存配置失败'));\n""",
          )

          replace(
              "frontend/app/projects/[projectId]/page.tsx",
              """  useEffect(() => {\n    let active = true;\n    setProject(null);\n    setExecutionPlan(null);\n    setError(null);\n    Promise.all([getUVProject(projectId), getProjectExecutionPlan(projectId)])\n""",
              """  useEffect(() => {\n    let active = true;\n    Promise.all([getUVProject(projectId), getProjectExecutionPlan(projectId)])\n""",
          )
          replace(
              "frontend/app/projects/page.tsx",
              """  useEffect(() => {\n    void refresh();\n  }, []);\n""",
              """  useEffect(() => {\n    const timer = window.setTimeout(() => {\n      void refresh();\n    }, 0);\n    return () => window.clearTimeout(timer);\n  }, []);\n""",
          )
          replace(
              "frontend/components/Sandbox/Sandbox.tsx",
              "let body: Record<string, unknown> = {};",
              "const body: Record<string, unknown> = {};",
          )

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify lint remediation candidate
        working-directory: frontend
        run: npm run lint

      - name: Verify remediation candidate production build
        working-directory: frontend
        run: npm run build

      - name: Publish remediation candidate to subordinate worker branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C work/fix-dependency-ownership/lint-remediation
          git add frontend/app/projects/'[projectId]'/page.tsx frontend/app/projects/page.tsx frontend/app/settings/page.tsx frontend/components/Sandbox/Sandbox.tsx
          git commit -m "fix: remediate strict frontend lint errors"
          git push --force origin HEAD:work/fix-dependency-ownership/lint-remediation

  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV Studio core dependencies
        run: python -m pip install -r requirements-uv.txt

      - name: Verify UV Studio core dependency graph
        run: python -m pip check

      - name: Import UV Studio server from core dependencies
        run: python -c "import uv_studio.server; print('uv_studio.server core import ok')"

      - name: Compile UV Studio Python
        run: python -m compileall tools tests uv_studio

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate root launchers load
        run: |
          python tools/vendor_videoclaw.py --help
          python tools/promote_frontend.py --check
          python tools/uv_dev.py --help
          python tools/uv_dev.py paths

      - name: Validate upstream and derived frontend provenance
        shell: python
        run: |
          import json
          from pathlib import Path
          lock = json.loads(Path("upstream/video-claw.lock.json").read_text(encoding="utf-8"))
          marker = json.loads(Path("frontend/.uv-derived.json").read_text(encoding="utf-8"))
          assert lock["schema_version"] == 1
          assert len(lock["commit"]) == 40
          assert lock["subtree"] == "video-claw/video-claw"
          assert marker["source_commit"] == lock["commit"]
          assert marker["source_subtree"] == f"{lock['subtree']}/frontend"
          assert Path("frontend/UPSTREAM_LICENSE").is_file()

  app-baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compile pinned VideoClaw snapshot without importing its runtime
        run: python -m compileall vendor/videoclaw-app/backend

      - name: Install UV Studio development/test dependencies
        run: python -m pip install -r requirements-uv-dev.txt

      - name: Verify UV Studio dependency graph
        run: python -m pip check

      - name: Import UV Studio server without vendor dependency installation
        run: python -c "import uv_studio.server; print('uv_studio.server independent import ok')"

      - name: Run UV Studio API integration tests
        run: python -m unittest discover -s tests_api -v

      - name: Probe backend through UV Studio over real HTTP
        run: python tools/uv_dev.py health-smoke --startup-timeout 45

      - name: Install UV Studio frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint UV Studio frontend
        working-directory: frontend
        run: npm run lint

      - name: Audit UV Studio frontend high-severity dependencies
        working-directory: frontend
        run: npm run audit:high

      - name: Build UV Studio frontend
        working-directory: frontend
        run: npm run build
