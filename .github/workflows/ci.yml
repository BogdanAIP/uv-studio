name: CI

on:
  push:
    branches: [main, "stage-*/**", "fix/**", "chore/**", "research/**"]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read

jobs:
  development-context:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate development context
        run: python tools/validate_development_context.py

  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV Studio core dependencies
        run: python -m pip install -r requirements-uv.txt

      - name: Verify UV Studio core dependency graph
        run: python -m pip check

      - name: Import UV Studio server from core dependencies
        run: python -c "import uv_studio.server; print('uv_studio.server core import ok')"

      - name: Compile UV Studio Python
        run: python -m compileall e2e tools tests tests_real_media uv_studio

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate root launchers load
        run: |
          python tools/vendor_videoclaw.py --help
          python tools/verify_frontend_provenance.py --help
          python tools/uv_dev.py --help
          python tools/uv_dev.py paths

      - name: Validate read-only frontend provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/verify_frontend_provenance.py

  app-baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compile pinned VideoClaw snapshot without importing its runtime
        run: python -m compileall vendor/videoclaw-app/backend

      - name: Install UV Studio development/test dependencies
        run: python -m pip install -r requirements-uv-dev.txt

      - name: Verify UV Studio dependency graph
        run: python -m pip check

      - name: Import UV Studio server without vendor dependency installation
        run: python -c "import uv_studio.server; print('uv_studio.server independent import ok')"

      - name: Run UV Studio API integration tests
        run: python -m unittest discover -s tests_api -v

      - name: Probe backend through UV Studio over real HTTP
        run: python tools/uv_dev.py health-smoke --startup-timeout 45

      - name: Provision FFmpeg and MLT on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg melt

      - name: Provision pinned FFmpeg and MLT on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://download.kde.org/stable/kdenlive/26.04/windows/kdenlive-26.04.3_standalone.exe'
          $expectedSha256 = 'f2dc616c9c29cae261a4e4fc56293f5e88362b8024dc0b8f662c480c97e18df9'
          $archive = Join-Path $env:RUNNER_TEMP 'kdenlive-26.04.3_standalone.exe'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'uv-kdenlive-media-toolchain'

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Kdenlive standalone SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }

          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          & 7z x $archive "-o$extractRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed to extract pinned Windows media toolchain: exit $LASTEXITCODE" }

          $ffmpeg = Get-ChildItem -Path $extractRoot -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw 'Pinned Windows media toolchain did not contain ffmpeg.exe' }
          $ffprobe = Join-Path $ffmpeg.Directory.FullName 'ffprobe.exe'
          if (-not (Test-Path $ffprobe)) { throw 'Pinned Windows media toolchain did not contain ffprobe.exe beside ffmpeg.exe' }
          $melt = Get-ChildItem -Path $extractRoot -Recurse -Filter melt.exe | Select-Object -First 1
          if (-not $melt) { throw 'Pinned Windows media toolchain did not contain melt.exe' }
          $ffmpeg.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $melt.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Record media toolchain
        run: |
          ffmpeg -version
          ffprobe -version
          melt -version

      - name: Run Stage 4A real-media golden suite
        env:
          UV_REAL_MEDIA_REPORT: stage4a-real-media-${{ runner.os }}.json
        run: python -m unittest discover -s tests_real_media -v

      - name: Upload Stage 4A real-media evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4a-real-media-${{ matrix.os }}
          path: stage4a-real-media-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Install UV Studio frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint UV Studio frontend
        working-directory: frontend
        run: npm run lint

      - name: Audit UV Studio frontend high-severity dependencies
        working-directory: frontend
        run: npm run audit:high

      - name: Build UV Studio frontend
        working-directory: frontend
        run: npm run build

      - name: Provision Chromium for Playwright on Ubuntu
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Provision Chromium for Playwright on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      - name: Run Stage 4C + Stage 5 browser user-outcome suite
        env:
          UV_E2E_ARTIFACT_DIR: e2e-artifacts/${{ runner.os }}
        run: python e2e/run_browser_e2e.py

      - name: Upload browser E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ matrix.os }}
          path: e2e-artifacts/${{ runner.os }}/**
          if-no-files-found: error
          retention-days: 14
