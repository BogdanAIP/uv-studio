name: Stage 9 Windows Release

on:
  push:
    branches: ["stage-9/**"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stage9-release.yml"
      - "frontend/**"
      - "packaging/**"
      - "requirements-uv*.txt"
      - "tools/**"
      - "uv_studio/**"

jobs:
  portable-bundle:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"

      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Export validated Stage 9 release profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & python tools/export_release_profile.py --github-env $env:GITHUB_ENV
          if ($LASTEXITCODE -ne 0) { throw 'release profile export failed' }

      - name: Verify selected language runtimes match release profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonVersion = (& python -c "import platform; print(platform.python_version())").Trim()
          if ($pythonVersion -ne $env:UV_PYTHON_VERSION) {
            throw "setup-python mismatch: expected $env:UV_PYTHON_VERSION, got $pythonVersion"
          }
          $nodeVersion = (& node --version).Trim()
          if ($nodeVersion -ne "v$env:UV_NODE_VERSION") {
            throw "setup-node mismatch: expected v$env:UV_NODE_VERSION, got $nodeVersion"
          }

      - name: Install exact shipping Python runtime graph
        run: python -m pip install -r requirements-uv-release.txt

      - name: Verify shipping Python runtime before build tools
        run: |
          python -m pip check
          python tools/verify_release_python_lock.py

      - name: Install exact build-only freezer
        shell: pwsh
        run: python -m pip install "pyinstaller==$env:UV_PYINSTALLER_VERSION"

      - name: Build Windows one-folder backend component
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --noupx
          --paths .
          --name uv-studio-backend
          packaging/backend_entry.py

      - name: Build and stage standalone frontend component
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location frontend
          try {
            npm ci
            npm run lint
            npm run audit:high
            npm run build
          } finally {
            Pop-Location
          }
          $frontendStage = Join-Path $env:RUNNER_TEMP 'uv-frontend-standalone'
          python tools/stage_frontend_release.py --frontend-root frontend --output $frontendStage
          if ($LASTEXITCODE -ne 0) { throw "frontend release staging failed with exit $LASTEXITCODE" }
          "UV_FRONTEND_STAGE=$frontendStage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Provision pinned release Node executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $node = Join-Path $env:RUNNER_TEMP 'uv-node.exe'
          Invoke-WebRequest -Uri $env:UV_NODE_URL -OutFile $node
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $node).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $env:UV_NODE_SHA256) {
            throw "Node SHA-256 mismatch: expected $env:UV_NODE_SHA256, got $actualSha256"
          }
          $version = (& $node --version).Trim()
          if ($version -ne "v$env:UV_NODE_VERSION") {
            throw "unexpected Node version: $version"
          }
          "UV_NODE_EXECUTABLE=$node" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Provision pinned Windows media runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "kdenlive-$env:UV_MEDIA_PACKAGE_VERSION-standalone.exe"
          $extractRoot = Join-Path $env:RUNNER_TEMP 'uv-kdenlive-media-runtime'
          Invoke-WebRequest -Uri $env:UV_MEDIA_URL -OutFile $archive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $env:UV_MEDIA_SHA256) {
            throw "Kdenlive standalone SHA-256 mismatch: expected $env:UV_MEDIA_SHA256, got $actualSha256"
          }
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          & 7z x $archive "-o$extractRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed to extract media runtime: exit $LASTEXITCODE" }

          $ffmpeg = Get-ChildItem -Path $extractRoot -Recurse -File -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw 'pinned media runtime did not contain ffmpeg.exe' }
          $ffprobe = Join-Path $ffmpeg.Directory.FullName 'ffprobe.exe'
          if (-not (Test-Path -LiteralPath $ffprobe -PathType Leaf)) {
            throw 'pinned media runtime did not contain ffprobe.exe beside ffmpeg.exe'
          }
          $melt = Get-ChildItem -Path $extractRoot -Recurse -File -Filter melt.exe | Select-Object -First 1
          if (-not $melt) { throw 'pinned media runtime did not contain melt.exe' }

          $mediaComponentVersion = "kdenlive-$env:UV_MEDIA_PACKAGE_VERSION"
          "UV_MEDIA_ROOT=$extractRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UV_FFMPEG_EXECUTABLE=$($ffmpeg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UV_FFPROBE_EXECUTABLE=$ffprobe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UV_MLT_EXECUTABLE=$($melt.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UV_MEDIA_COMPONENT_VERSION=$mediaComponentVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage one immutable Windows payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:RUNNER_TEMP 'uv-studio-windows-x86_64'
          $stageOutput = & python tools/stage_windows_release.py `
            --backend-root 'dist/uv-studio-backend' `
            --frontend-root $env:UV_FRONTEND_STAGE `
            --node-executable $env:UV_NODE_EXECUTABLE `
            --media-root $env:UV_MEDIA_ROOT `
            --ffmpeg-executable $env:UV_FFMPEG_EXECUTABLE `
            --ffprobe-executable $env:UV_FFPROBE_EXECUTABLE `
            --mlt-executable $env:UV_MLT_EXECUTABLE `
            --output $release
          if ($LASTEXITCODE -ne 0) { throw "Windows release staging failed: $stageOutput" }
          $stage = $stageOutput | ConvertFrom-Json
          if (-not $stage.ok) { throw 'Windows release staging did not report ok=true' }

          "UV_RELEASE_ROOT=$release" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UV_BACKEND_ENTRYPOINT=$($stage.entrypoints.backend)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UV_FRONTEND_ENTRYPOINT=$($stage.entrypoints.frontend)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UV_NODE_ENTRYPOINT=$($stage.entrypoints.node)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UV_FFMPEG_ENTRYPOINT=$($stage.entrypoints.ffmpeg)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UV_FFPROBE_ENTRYPOINT=$($stage.entrypoints.ffprobe)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UV_MLT_ENTRYPOINT=$($stage.entrypoints.mlt)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "staged files=$($stage.file_count), media files=$($stage.media_file_count)"

      - name: Build and deep-verify D-044 release manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & python tools/uv_release.py build-manifest `
            --root $env:UV_RELEASE_ROOT `
            --product-version $env:UV_PRODUCT_VERSION `
            --build-id $env:GITHUB_SHA `
            --arch x86_64 `
            --component "backend=$env:UV_PRODUCT_VERSION=$env:UV_BACKEND_ENTRYPOINT" `
            --component "frontend=$env:UV_PRODUCT_VERSION=$env:UV_FRONTEND_ENTRYPOINT" `
            --component "node=$env:UV_NODE_VERSION=$env:UV_NODE_ENTRYPOINT" `
            --component "ffmpeg=$env:UV_MEDIA_COMPONENT_VERSION=$env:UV_FFMPEG_ENTRYPOINT" `
            --component "ffprobe=$env:UV_MEDIA_COMPONENT_VERSION=$env:UV_FFPROBE_ENTRYPOINT" `
            --component "mlt=$env:UV_MEDIA_COMPONENT_VERSION=$env:UV_MLT_ENTRYPOINT"
          if ($LASTEXITCODE -ne 0) { throw 'release manifest build failed' }
          & python tools/uv_release.py verify --root $env:UV_RELEASE_ROOT --deep
          if ($LASTEXITCODE -ne 0) { throw 'release manifest deep verification failed' }

      - name: Prove same-size payload tampering fails closed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:UV_RELEASE_ROOT 'frontend/server.js'
          $backup = Join-Path $env:RUNNER_TEMP 'uv-frontend-server.js.backup'
          Copy-Item -LiteralPath $target -Destination $backup
          python -c "from pathlib import Path; p=Path(r'''$target'''); data=bytearray(p.read_bytes()); assert data; data[0] ^= 1; p.write_bytes(data)"
          if ($LASTEXITCODE -ne 0) { throw 'could not create tamper proof payload' }

          $verifyOutput = & python tools/uv_release.py verify --root $env:UV_RELEASE_ROOT --deep 2>&1
          $verifyCode = $LASTEXITCODE
          $verifyOutput | Write-Host
          if ($verifyCode -eq 0) { throw 'deep verification accepted a same-size tampered payload' }

          Copy-Item -LiteralPath $backup -Destination $target -Force
          & python tools/uv_release.py verify --root $env:UV_RELEASE_ROOT --deep
          if ($LASTEXITCODE -ne 0) { throw 'release did not verify after restoring the exact payload' }

      - name: Smoke complete bundle through packaged frontend and frozen backend child
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = $env:UV_RELEASE_ROOT
          $backend = Join-Path $release $env:UV_BACKEND_ENTRYPOINT
          $node = Join-Path $release $env:UV_NODE_ENTRYPOINT
          $frontendDir = Join-Path $release 'frontend'
          $ffmpeg = Join-Path $release $env:UV_FFMPEG_ENTRYPOINT
          $ffprobe = Join-Path $release $env:UV_FFPROBE_ENTRYPOINT
          $melt = Join-Path $release $env:UV_MLT_ENTRYPOINT

          if ((& $node --version).Trim() -ne "v$env:UV_NODE_VERSION") {
            throw 'bundled Node executable returned the wrong version'
          }
          & $ffmpeg -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'bundled FFmpeg did not execute' }
          & $ffprobe -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'bundled FFprobe did not execute' }
          & $melt -version
          if ($LASTEXITCODE -ne 0) { throw 'bundled MLT melt did not execute' }

          $env:UV_STUDIO_RELEASE_ROOT = $release
          $env:UV_STUDIO_USER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'uv-studio-packaged-user-data'
          $backendProc = Start-Process -FilePath $backend -ArgumentList '--backend-child' -PassThru -NoNewWindow
          $frontendProc = $null
          try {
            $deadline = (Get-Date).AddSeconds(45)
            $backendReady = $false
            while ((Get-Date) -lt $deadline) {
              if ($backendProc.HasExited) { throw "packaged backend exited early with code $($backendProc.ExitCode)" }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/api/health' -TimeoutSec 2
                if ($health.status -eq 'ok' -and $health.service -eq 'uv-studio') {
                  $backendReady = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $backendReady) { throw 'packaged backend did not become healthy' }

            $env:HOSTNAME = '127.0.0.1'
            $env:PORT = '3100'
            $frontendProc = Start-Process -FilePath $node -ArgumentList 'server.js' -WorkingDirectory $frontendDir -PassThru -NoNewWindow
            $deadline = (Get-Date).AddSeconds(45)
            $frontendReady = $false
            while ((Get-Date) -lt $deadline) {
              if ($frontendProc.HasExited) { throw "packaged frontend exited early with code $($frontendProc.ExitCode)" }
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:3100/' -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $frontendReady = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $frontendReady) { throw 'packaged frontend did not become ready' }

            foreach ($url in @(
              'http://127.0.0.1:3100/',
              'http://127.0.0.1:3100/projects/packaged-release-smoke'
            )) {
              $response = Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 10
              if ($response.StatusCode -ne 200) { throw "unexpected HTTP $($response.StatusCode) for $url" }
            }

            $createBody = @{title = 'Packaged Release Smoke'; recipe_id = 'general_video'} | ConvertTo-Json -Compress
            $created = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:3100/api/uv/projects' -ContentType 'application/json' -Body $createBody -TimeoutSec 10
            if (-not $created.project_id) { throw 'same-origin project creation did not return project_id' }
            $projects = @(Invoke-RestMethod -Uri 'http://127.0.0.1:3100/api/uv/projects' -TimeoutSec 10)
            if (-not ($projects | Where-Object { $_.project_id -eq $created.project_id })) {
              throw 'same-origin project list did not contain the created packaged project'
            }

            $diagnostics = Invoke-RestMethod -Uri 'http://127.0.0.1:3100/api/uv/diagnostics?verify_release=true' -TimeoutSec 120
            if ($diagnostics.mode -ne 'packaged' -or $diagnostics.overall_status -ne 'ok') {
              throw "packaged diagnostics rejected bundle: $($diagnostics | ConvertTo-Json -Depth 8 -Compress)"
            }
            if (-not $diagnostics.runtime.frozen) { throw 'diagnostics did not observe the frozen backend runtime' }
            if (-not $diagnostics.release.integrity.ok -or -not $diagnostics.release.integrity.verify_hashes) {
              throw 'frozen backend did not deep-verify the release payload'
            }
            foreach ($tool in @('ffmpeg', 'ffprobe', 'melt')) {
              if ($diagnostics.media_tools.$tool.source -ne 'release_manifest') {
                throw "$tool did not resolve from the packaged release manifest"
              }
            }
          } finally {
            if ($frontendProc -and -not $frontendProc.HasExited) { Stop-Process -Id $frontendProc.Id -Force }
            if (-not $backendProc.HasExited) { Stop-Process -Id $backendProc.Id -Force }
          }

      - name: Smoke native desktop launcher supervision
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $backend = Join-Path $env:UV_RELEASE_ROOT $env:UV_BACKEND_ENTRYPOINT
          $env:UV_STUDIO_USER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'uv-studio-desktop-launcher-user-data'
          & $backend --desktop-smoke
          if ($LASTEXITCODE -ne 0) {
            throw "desktop launcher smoke failed with exit $LASTEXITCODE"
          }

      - name: Provision pinned NSIS compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:UV_NSIS_PROVIDER -ne 'chocolatey') {
            throw "unsupported NSIS acquisition provider: $env:UV_NSIS_PROVIDER"
          }
          $choco = Get-Command choco.exe -ErrorAction Stop
          & $choco.Source install $env:UV_NSIS_PACKAGE `
            "--version=$env:UV_NSIS_PACKAGE_VERSION" `
            "--source=$env:UV_NSIS_SOURCE" `
            --yes `
            --no-progress `
            --limit-output `
            --allow-downgrade
          $chocoExit = $LASTEXITCODE
          if ($chocoExit -notin @(0, 1641, 3010)) {
            throw "Chocolatey failed to install pinned NSIS package with exit $chocoExit"
          }

          $candidates = @()
          if (${env:ProgramFiles(x86)}) {
            $candidates += Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          }
          if ($env:ProgramFiles) {
            $candidates += Join-Path $env:ProgramFiles 'NSIS\makensis.exe'
          }
          $makensisPath = $candidates | Where-Object {
            Test-Path -LiteralPath $_ -PathType Leaf
          } | Select-Object -First 1
          if (-not $makensisPath) { throw 'pinned NSIS package did not install makensis.exe' }
          $versionOutput = (& $makensisPath /VERSION | Out-String).Trim()
          if ($versionOutput -ne "v$env:UV_NSIS_VERSION") {
            throw "unexpected NSIS version output: $versionOutput"
          }
          "UV_MAKENSIS=$makensisPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build per-user versioned Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseId = "$env:UV_PRODUCT_VERSION-$($env:GITHUB_SHA.Substring(0, 12))"
          if ($releaseId -notmatch '^[A-Za-z0-9._-]+$') {
            throw "release id is not Windows-path-safe: $releaseId"
          }
          $installer = Join-Path $env:RUNNER_TEMP 'uv-studio-windows-x86_64-setup.exe'
          & $env:UV_MAKENSIS `
            /V3 `
            "/DUV_RELEASE_ROOT=$env:UV_RELEASE_ROOT" `
            "/DUV_RELEASE_ID=$releaseId" `
            "/DUV_PRODUCT_VERSION=$env:UV_PRODUCT_VERSION" `
            "/DUV_OUTPUT_FILE=$installer" `
            'packaging/windows/uv-studio.nsi'
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer compilation failed with exit $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'NSIS installer output is missing' }
          "UV_RELEASE_ID=$releaseId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UV_INSTALLER_PATH=$installer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove silent install, installed launch and safe uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\UV Studio'
          $userDataRoot = Join-Path $env:LOCALAPPDATA 'UV Studio'
          $startMenuRoot = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\UV Studio'
          if (Test-Path -LiteralPath $installRoot) { Remove-Item -LiteralPath $installRoot -Recurse -Force }
          if (Test-Path -LiteralPath $userDataRoot) { Remove-Item -LiteralPath $userDataRoot -Recurse -Force }

          $install = Start-Process -FilePath $env:UV_INSTALLER_PATH -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "silent installer failed with exit $($install.ExitCode)" }

          $currentRelease = Join-Path $installRoot 'current-release.txt'
          if (-not (Test-Path -LiteralPath $currentRelease -PathType Leaf)) { throw 'installer did not activate current-release.txt' }
          $activatedId = (Get-Content -LiteralPath $currentRelease -Raw).Trim()
          if ($activatedId -ne $env:UV_RELEASE_ID) {
            throw "installer activated unexpected release: $activatedId"
          }
          $installedBackend = Join-Path $installRoot "versions\$env:UV_RELEASE_ID\backend\uv-studio-backend.exe"
          if (-not (Test-Path -LiteralPath $installedBackend -PathType Leaf)) { throw 'installed launcher is missing' }
          if (-not (Test-Path -LiteralPath (Join-Path $startMenuRoot 'UV Studio.lnk') -PathType Leaf)) {
            throw 'Start Menu launcher shortcut is missing'
          }

          & $installedBackend --verify-release
          if ($LASTEXITCODE -ne 0) { throw 'installed release failed product-owned deep verification' }

          New-Item -ItemType Directory -Force -Path $userDataRoot | Out-Null
          $sentinel = Join-Path $userDataRoot 'installer-preserve-sentinel.txt'
          Set-Content -LiteralPath $sentinel -Value 'PRESERVE_USER_DATA' -Encoding utf8 -NoNewline
          $env:UV_STUDIO_USER_DATA_DIR = $userDataRoot
          & $installedBackend --desktop-smoke
          if ($LASTEXITCODE -ne 0) { throw 'installed desktop launcher smoke failed' }

          $uninstaller = Join-Path $installRoot 'Uninstall.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw 'uninstaller is missing' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "silent uninstaller failed with exit $($uninstall.ExitCode)" }

          $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline -and (Test-Path -LiteralPath $installRoot)) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path -LiteralPath $installRoot) { throw 'uninstaller left the immutable application root behind' }
          if (Test-Path -LiteralPath $startMenuRoot) { throw 'uninstaller left the Start Menu group behind' }
          if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf)) {
            throw 'uninstaller deleted D-045 user data'
          }
          if ((Get-Content -LiteralPath $sentinel -Raw) -ne 'PRESERVE_USER_DATA') {
            throw 'uninstaller modified D-045 user data'
          }
          Remove-Item -LiteralPath $userDataRoot -Recurse -Force

      - name: Archive exact portable bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'uv-studio-windows-x86_64.zip'
          Push-Location $env:UV_RELEASE_ROOT
          try {
            & 7z a -tzip $archive '.\*' -mx=5 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z failed to archive release payload: exit $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'portable release archive is missing' }
          $listing = & 7z l $archive
          if ($LASTEXITCODE -ne 0) { throw 'could not inspect portable release archive' }
          if (-not ($listing | Select-String -SimpleMatch 'release-manifest.json')) {
            throw 'portable release archive does not contain release-manifest.json'
          }

      - name: Record build-only dependency graph
        run: python -m pip freeze

      - name: Upload Windows portable and installer candidates
        uses: actions/upload-artifact@v4
        with:
          name: uv-studio-windows-x86_64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/uv-studio-windows-x86_64.zip
            ${{ runner.temp }}/uv-studio-windows-x86_64-setup.exe
          if-no-files-found: error
          retention-days: 7
