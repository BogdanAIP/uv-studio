name: Promote pinned frontend

on:
  workflow_dispatch:
  push:
    branches: ["stage-1/frontend-shell"]
    paths:
      - "tools/promote_frontend.py"
      - "upstream/video-claw.lock.json"
      - ".github/workflows/promote-frontend.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Promote exact pinned frontend baseline
        run: python tools/promote_frontend.py

      - name: Verify derived frontend provenance
        shell: python
        run: |
          import json
          from pathlib import Path
          lock = json.loads(Path("upstream/video-claw.lock.json").read_text(encoding="utf-8"))
          marker = json.loads(Path("frontend/.uv-derived.json").read_text(encoding="utf-8"))
          assert marker["source_commit"] == lock["commit"]
          assert marker["source_subtree"] == f"{lock['subtree']}/frontend"
          assert marker["source_file_count"] > 0
          assert Path("frontend/UPSTREAM_LICENSE").is_file()
          assert Path("frontend/package.json").is_file()
          assert Path("frontend/package-lock.json").is_file()

      - name: Commit promoted baseline when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          if git diff --cached --quiet; then
            echo "Frontend baseline already matches the pinned source."
            exit 0
          fi
          PIN=$(python -c 'import json; print(json.load(open("upstream/video-claw.lock.json"))["commit"][:12])')
          git commit -m "frontend: promote VideoClaw ${PIN} baseline"
          git push origin "HEAD:${GITHUB_REF_NAME}"
