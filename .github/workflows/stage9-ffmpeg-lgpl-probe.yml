name: Stage 9 FFmpeg LGPL Probe

on:
  push:
    branches: ["research/stage9-ffmpeg-lgpl-probe"]

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify pinned BtbN LGPL FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-09-13-03/ffmpeg-n8.1.2-34-g9b6c8969e0-win64-lgpl-8.1.zip'
          $expected = '6b4edff47f121d2ed218b1b19d17f67aed08f9f1c9cbcee576fd0548a748c412'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-lgpl.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-lgpl'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          Write-Host "sha256=$actual"
          if ($actual -ne $expected) { throw "asset SHA mismatch: expected $expected got $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $ffmpeg = Get-ChildItem -Path $extract -Recurse -File -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe missing' }
          $ffprobe = Join-Path $ffmpeg.Directory.FullName 'ffprobe.exe'
          if (-not (Test-Path -LiteralPath $ffprobe -PathType Leaf)) { throw 'ffprobe.exe missing beside ffmpeg.exe' }
          $distribution = $ffmpeg.Directory.Parent.FullName
          foreach ($name in @('LICENSE.txt', 'BUILDINFO.txt')) {
            $candidate = Join-Path $distribution $name
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) { throw "$name missing from distribution" }
            Write-Host "$name=$candidate"
          }
          $buildconf = (& $ffmpeg.FullName -hide_banner -buildconf 2>&1 | Out-String)
          Write-Host $buildconf
          if ($buildconf -match '--enable-nonfree') { throw 'LGPL candidate unexpectedly enables nonfree' }
          if ($buildconf -match '--enable-gpl') { throw 'LGPL candidate unexpectedly enables GPL parts' }
          $encoders = (& $ffmpeg.FullName -hide_banner -encoders 2>&1 | Out-String)
          foreach ($encoder in @('libopenh264', 'libvpx-vp9', 'libopus', 'ffv1', 'flac', 'aac')) {
            if ($encoders -notmatch "(?m)^ .*$encoder") { throw "required encoder missing: $encoder" }
            Write-Host "encoder-ok=$encoder"
          }
          & $ffmpeg.FullName -version | Select-Object -First 1
          & $ffprobe -version | Select-Object -First 1
